
services:
  postgres:
    image: postgres:16-alpine
    container_name: lulo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lulo_db}
      POSTGRES_USER: ${DB_USER:-lulo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lulo_pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - lulo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lulo_user} -d ${DB_NAME:-lulo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lulo_pgdata:
